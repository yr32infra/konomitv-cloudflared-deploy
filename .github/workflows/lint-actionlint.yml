name: lint actions

on:
  pull_request:
    paths:
      - '.github/workflows/**'

jobs:
  lint-actionlint:
    runs-on: ubuntu-24.04

    steps:
       - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

       - uses: reviewdog/action-actionlint@v1.72
         with:
           github_token: ${{ secrets.GITHUB_TOKEN }}
           reporter: github-pr-check
